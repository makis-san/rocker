name: Linux packages

# dist (release.yml) builds the raw binaries, shell installer, and Homebrew
# formula. It has no .deb/.rpm support, so this workflow builds those
# separately and attaches them to the same GitHub Release once dist has
# created it. Runs after the "Release" workflow finishes on a release tag.
#
# A final `checksums` job then publishes a single SHA256SUMS (+ a minisign
# SHA256SUMS.minisig when the signing secret is set) over every asset on the
# release. `install.sh` / `install.ps1` and `rocker self-update` verify against
# those two files. Because workflow_run exposes the triggering commit reliably
# but not always the tag ref, the first job resolves the release tag from that
# commit before packaging starts.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-tag:
    name: resolve release tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Resolve tag for release commit
        shell: bash
        run: |
          tag="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/tags" \
            --jq '.[].name' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$' \
            | head -1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.target }})
    needs: [resolve-tag]
    if: >
      needs.resolve-tag.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-pkg-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p rocker --features tray

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build .deb
        run: cargo deb -p rocker --no-build

      - name: Build .rpm
        run: |
          strip -s target/release/rocker
          cargo generate-rpm -p crates/rocker

      - name: Rename artifacts with target triple
        run: |
          mkdir -p dist-out
          for f in target/debian/*.deb; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.deb"
          done
          for f in target/generate-rpm/*.rpm; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.rpm"
          done

      - name: Upload to the GitHub Release
        run: gh release upload "$TAG" dist-out/* --clobber --repo "${{ github.repository }}"

  checksums:
    name: checksums & signature
    needs: [resolve-tag, package]
    if: >
      needs.resolve-tag.result == 'success' &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.workflow_run.head_branch }}
      # Passwordless minisign key (rsign generate -W); no companion password.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Download every release asset
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS SHA256SUMS.minisig

      - name: Compute SHA256SUMS
        run: |
          # Hash from outside `dist/` so the output file can't glob itself in.
          ( cd dist && sha256sum -- * ) | sort -k2 > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Sign SHA256SUMS
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          cargo install rsign2 --locked
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          rsign sign -W -s minisign.key \
            -x dist/SHA256SUMS.minisig -t "rocker $TAG SHA256SUMS" dist/SHA256SUMS
          rm -f minisign.key
          test -f dist/SHA256SUMS.minisig

      - name: Attach to the release
        run: |
          files=(dist/SHA256SUMS)
          [ -f dist/SHA256SUMS.minisig ] && files+=(dist/SHA256SUMS.minisig)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
