name: Linux packages

# dist (release.yml) builds the raw binaries, shell installer, and Homebrew
# formula. It has no .deb/.rpm support, so this workflow builds those
# separately and attaches them to the same GitHub Release once dist has
# created it. Runs after the "Release" workflow finishes on a release tag.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.target }})
    # dist's own release.yml triggers on tags like `v1.2.3` (see its `on.push.tags`
    # pattern); mirror that loosely here since workflow_run only exposes the ref name.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-pkg-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p rocker

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build .deb
        run: cargo deb -p rocker --no-build

      - name: Build .rpm
        run: |
          strip -s target/release/rocker
          cargo generate-rpm -p crates/rocker

      - name: Rename artifacts with target triple
        run: |
          mkdir -p dist-out
          for f in target/debian/*.deb; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.deb"
          done
          for f in target/generate-rpm/*.rpm; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.rpm"
          done

      - name: Upload to the GitHub Release
        run: gh release upload "${{ github.event.workflow_run.head_branch }}" dist-out/* --clobber --repo "${{ github.repository }}"
