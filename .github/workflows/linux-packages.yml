name: Linux packages

# dist (release.yml) builds the raw binaries, shell installer, and Homebrew
# formula. It has no .deb/.rpm support, so this workflow builds those
# separately and attaches them to the same GitHub Release once dist has
# created it. Runs after the "Release" workflow finishes on a release tag.
#
# A final `checksums` job then publishes a single SHA256SUMS (+ a minisign
# SHA256SUMS.minisig when the signing secret is set) over every asset on the
# release. `install.sh` / `install.ps1` and `rocker self-update` verify against
# those two files. It lives here rather than in its own workflow so it has the
# release tag directly (a second `workflow_run` hop loses the tag ref).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.target }})
    # dist's own release.yml triggers on tags like `v1.2.3` (see its `on.push.tags`
    # pattern); mirror that loosely here since workflow_run only exposes the ref name.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-pkg-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p rocker --features tray

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build .deb
        run: cargo deb -p rocker --no-build

      - name: Build .rpm
        run: |
          strip -s target/release/rocker
          cargo generate-rpm -p crates/rocker

      - name: Rename artifacts with target triple
        run: |
          mkdir -p dist-out
          for f in target/debian/*.deb; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.deb"
          done
          for f in target/generate-rpm/*.rpm; do
            cp "$f" "dist-out/rocker-${{ matrix.target }}.rpm"
          done

      - name: Upload to the GitHub Release
        run: gh release upload "${{ github.event.workflow_run.head_branch }}" dist-out/* --clobber --repo "${{ github.repository }}"

  checksums:
    name: checksums & signature
    needs: [package]
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.workflow_run.head_branch }}
      # Passwordless minisign key (rsign generate -W); no companion password.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Download every release asset
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS SHA256SUMS.minisig

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          cargo install rsign2 --locked
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          rsign sign -W -s minisign.key \
            -x dist/SHA256SUMS.minisig -t "rocker $TAG SHA256SUMS" dist/SHA256SUMS
          rm -f minisign.key
          test -f dist/SHA256SUMS.minisig

      - name: Attach to the release
        run: |
          files=(dist/SHA256SUMS)
          [ -f dist/SHA256SUMS.minisig ] && files+=(dist/SHA256SUMS.minisig)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
