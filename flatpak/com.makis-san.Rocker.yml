app-id: com.makis-san.Rocker
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rocker

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration
  - --device=dri
  # Network access for Docker API
  - --share=network
  # Docker socket access
  - --filesystem=/var/run/docker.sock
  # Home directory access for Docker config
  - --filesystem=home/.docker:create
  # D-Bus access for desktop integration
  - --session-bus
  - --system-bus
  # Environment variables for EGL/GPU
  - --env=DISPLAY=:0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rocker/cargo
    CARGO_INCREMENTAL: '0'
  build-args:
    - --share=network

modules:
  - name: rocker
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --target-dir=target
      - install -Dm755 target/release/rocker /app/bin/rocker
      - install -Dm644 flatpak/com.makis-san.Rocker.desktop /app/share/applications/com.makis-san.Rocker.desktop
      - install -Dm644 flatpak/com.makis-san.Rocker.appdata.xml /app/share/metainfo/com.makis-san.Rocker.appdata.xml
      - install -Dm644 assets/rocker-logo.png /app/share/icons/hicolor/256x256/apps/com.makis-san.Rocker.png
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
