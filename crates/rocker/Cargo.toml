[package]
name = "rocker"
description = "Rocker: a native desktop client for the Docker Engine API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
default-run = "rocker"

[package.metadata.wix]
upgrade-guid = "09C61034-1A38-42C6-A46E-5D93A3A4F798"
path-guid = "1035E96C-4E12-405E-89FA-92FF9D32625D"
license = false
eula = false

# `cargo deb -p rocker` (built from the workspace root; see
# .github/workflows/linux-packages.yml). Desktop entry, AppStream metadata and
# icon are shared with the Flatpak build (../../packaging/linux/).
[package.metadata.deb]
maintainer = "Rocker contributors <noreply@github.com>"
copyright = "2026, Rocker contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
Rocker is a native desktop client for the Docker Engine API: container \
lifecycle management, streaming logs and stats, an interactive exec shell, \
and container groups, with no webview and no bundled Chromium."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/rocker", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.makis_san.Rocker.desktop", "usr/share/applications/io.github.makis_san.Rocker.desktop", "644"],
    ["../../packaging/linux/io.github.makis_san.Rocker.metainfo.xml", "usr/share/metainfo/io.github.makis_san.Rocker.metainfo.xml", "644"],
    ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.makis_san.Rocker.png", "644"],
]

# `cargo generate-rpm -p crates/rocker` (built from the workspace root).
[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/rocker", dest = "/usr/bin/rocker", mode = "755" },
    { source = "packaging/linux/io.github.makis_san.Rocker.desktop", dest = "/usr/share/applications/io.github.makis_san.Rocker.desktop", mode = "644" },
    { source = "packaging/linux/io.github.makis_san.Rocker.metainfo.xml", dest = "/usr/share/metainfo/io.github.makis_san.Rocker.metainfo.xml", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.makis_san.Rocker.png", mode = "644" },
]

[[bin]]
name = "rocker"
path = "src/main.rs"

[dependencies]
rocker-ui = { workspace = true }
rocker-store = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
eframe = "0.33.3"
egui = "0.33.3"
tokio = "1.53.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# System-tray icon + "minimize to tray". Opt-in: on Linux it pulls GTK 3 and
# libappindicator dev libraries. Build with `cargo run --features tray`.
tray = ["rocker-ui/tray"]
