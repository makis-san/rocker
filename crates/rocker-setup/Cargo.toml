[package]
name = "rocker-setup"
description = "Self-install, desktop integration, and self-update for the Rocker binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

# `self-update` only. Kept behind a feature so `install`/`uninstall`/`doctor`
# build with no network or crypto stack (and CI can ship a minimal variant).
ureq = { version = "3", optional = true }
minisign-verify = { version = "0.2", optional = true }
sha2 = { version = "0.11", optional = true }
self-replace = { version = "1.5", optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
winreg = "0.55"

[features]
default = ["self-update"]
self-update = [
    "dep:ureq",
    "dep:minisign-verify",
    "dep:sha2",
    "dep:self-replace",
    "dep:serde",
    "dep:serde_json",
]

[dev-dependencies]
tempfile = "3"
