[package]
name = "rocker-secrets"
description = "OS keychain wrapper and docker-credential-* helper bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Default "v1" features cover macOS Keychain, Windows Credential Manager, and
# Linux secret-service over `zbus` (pure Rust, no libdbus C dependency).
keyring = "4"
base64 = "0.23"
