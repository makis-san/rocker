[package]
name = "rocker-ext-host"
description = "Supervised extension host: rhai and wasmtime runtimes, capability gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rhai = { version = "1.20", default-features = false, features = ["std"] }
rocker-ext-api = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "1.1.5"
wasmtime = { version = "41.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
semver = "1.0.28"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ureq = "3"

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.243.0"
